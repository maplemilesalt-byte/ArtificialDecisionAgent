services:
  agent:
    build: .
    container_name: artificial-decision-agent
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_MAX_OUTPUT: ${AI_MAX_OUTPUT:-12000}
      MODEL_RETRIES: ${MODEL_RETRIES:-5}
      COMMAND_TIMEOUT: ${COMMAND_TIMEOUT:-120}
    network_mode: bridge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp
    read_only: false
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: artificial-decision-agent-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  ollama_models:
